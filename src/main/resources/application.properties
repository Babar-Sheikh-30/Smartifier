spring.application.name=Smartifier
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartifier}
# Expire idle sessions after 30 minutes; keep the session cookie unavailable to JavaScript.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local HTTP needs false; set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Blank admin credentials skip initial admin creation during normal startup.
smartifier.admin.email=${SMARTIFIER_ADMIN_EMAIL:}
smartifier.admin.password=${SMARTIFIER_ADMIN_PASSWORD:}
# Checkout redirects use this address; set it to the deployed site's public URL.
smartifier.public-url=${SMARTIFIER_PUBLIC_URL:http://localhost:8080}
# Blank Stripe keys allow the app to run while payment endpoints report unavailable.
smartifier.stripe.secret-key=${STRIPE_SECRET_KEY:}
smartifier.stripe.price-id=${STRIPE_PRICE_ID:}
# Default to a one-time payment; recurring prices need subscription mode.
smartifier.stripe.mode=${STRIPE_CHECKOUT_MODE:payment}
smartifier.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# SMS delivery through Twilio. Disabled until configuration and testing are complete.
smartifier.sms.enabled=${SMARTIFIER_SMS_ENABLED:false}
smartifier.sms.scheduler-enabled=${SMARTIFIER_SMS_SCHEDULER_ENABLED:false}

# Daily SMS schedule: 10:00 AM Toronto time.
smartifier.sms.cron=${SMARTIFIER_SMS_CRON:0 0 10 * * *}
smartifier.sms.time-zone=${SMARTIFIER_SMS_TIME_ZONE:America/Toronto}

# Public HTTPS URL configured for Twilio's incoming SMS webhook.
smartifier.sms.webhook-url=${SMARTIFIER_SMS_WEBHOOK_URL:}