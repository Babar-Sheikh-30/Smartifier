spring.application.name=Smartifier
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartifier}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
smartifier.admin.email=${SMARTIFIER_ADMIN_EMAIL:}
smartifier.admin.password=${SMARTIFIER_ADMIN_PASSWORD:}
