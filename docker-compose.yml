
services:
  mongo:
    image: mongo:7
    container_name: smartifier-mongo
    ports:
      - "27017:27017"
    volumes:
      - smartifier_mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sheikhbabar/smartifier-backend:latest
    container_name: smartifier-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/smartifier
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CHECKOUT_MODE: ${STRIPE_CHECKOUT_MODE:-payment}
      SMARTIFIER_PUBLIC_URL: ${SMARTIFIER_PUBLIC_URL:-http://localhost:8080}

      # Twilio SMS configuration
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # SMS sending and scheduling remain disabled by default.
      SMARTIFIER_SMS_ENABLED: ${SMARTIFIER_SMS_ENABLED:-false}
      SMARTIFIER_SMS_SCHEDULER_ENABLED: ${SMARTIFIER_SMS_SCHEDULER_ENABLED:-false}

      # Public HTTPS URL used to verify Twilio webhook signatures.
      SMARTIFIER_SMS_WEBHOOK_URL: ${SMARTIFIER_SMS_WEBHOOK_URL:-}

    depends_on:
      - mongo

  stripe-listener:
    # Start only with the stripe profile when forwarding local test webhook events.
    image: stripe/stripe-cli:latest
    profiles: [stripe]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: listen --forward-to http://backend:8080/api/payments/stripe/webhook --events checkout.session.completed,checkout.session.async_payment_succeeded
    depends_on:
      - backend

volumes:
  smartifier_mongo_data:
